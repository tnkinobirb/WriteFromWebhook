# ============================================
# WFWH v0.0.1 — SOURCEABLE BASH DEFAULTS
# ============================================
# Source this file directly: source ./wfwh.unix.conf
# Configure your own formatter before accepting live events.
#
# --- Webhook verification ---
export WFWH_SECRET_PATH="$HOME/.config/wfwh/webhook_secret"
export WFWH_WEBHOOK_ROUTE="/print"
export WFWH_HOST="localhost"  # Listen address: hostname or IP
export WFWH_PORT="5000"
export WFWH_RETRY_STATUS_CODE="503"

# --- Standard Webhooks v1 headers ---
export WFWH_WH_ID="webhook-id"
export WFWH_WH_TIMESTAMP="webhook-timestamp"
export WFWH_WH_SIGNATURE="webhook-signature"

# --- Formatter (required) ---
#! Placeholder is for testing only; it will not handle request data; replace with your trusted formatter.
export WFWH_FORMATTER_FILE="placeholder.py"

# --- Output destination / encoding / write mode ---
export WFWH_OUTPUT_PATH="output.bin"
export WFWH_OUTPUT_ENCODING="utf-8"
export WFWH_WRITE_MODE="w"  # Python open() mode; text needs str, binary accepts bytes

# --- Logging toggles ---
export WFWH_RECORD_LOGS="true"
export WFWH_PRINT_LOG_TO_SCREEN="false"
export WFWH_WRITE_LOG="false"

# --- Optional log path override ---
# With no override, the default is logs/wfwh-<run timestamp>.log
# Only used when WFWH_WRITE_LOG=true.
# export WFWH_WRITE_LOG_TO_FILE="$HOME/wfwh-receiver.log"

# ============================================
# OPTIONAL EXAMPLE: STOREKIT HEADERS AND FORMATTER
# ============================================
# Uncomment these to override the defaults above.
# export WFWH_WH_ID="svix-id"
# export WFWH_WH_TIMESTAMP="svix-timestamp"
# export WFWH_WH_SIGNATURE="svix-signature"
# export WFWH_FORMATTER_FILE="storekit.py"
