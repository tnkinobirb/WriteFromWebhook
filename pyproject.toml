[project]
name = "writefromwebhook"
version = "0.0.1"
description = "A configurable Standard Webhooks v1 receiver"
readme = "README.md"
authors = [
    { name = "Gabriel Dolbear" },
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "Flask",
    "waitress",
]

[project.optional-dependencies]
test = [
    "pytest",
    "tzdata",
]

[project.urls]
Repository = "https://github.com/tnkinobirb/WriteFromWebhook"

[tool.setuptools]
py-modules = ["wfwh", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["formatters*", "examples*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["testing"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"
